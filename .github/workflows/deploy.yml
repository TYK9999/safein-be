name: Deploy

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  quality:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  deploy:
    name: SSH deploy to EC2
    needs: quality
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve deploy paths
        id: meta
        run: |
          echo "app_dir=${APP_DIR:-/opt/safein5-be}" >> "$GITHUB_OUTPUT"
          echo "ssh_port=${SSH_PORT:-22}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
        env:
          APP_DIR: ${{ vars.APP_DIR }}
          SSH_PORT: ${{ vars.SSH_PORT }}

      - name: Write deploy revision marker
        run: |
          printf '%s\n' "${{ github.sha }}" > DEPLOY_SHA
          printf '%s\n' "${{ github.ref_name }}" > DEPLOY_ENV

      - name: Sync tree to EC2 (rsync over SSH)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY}"
          test -n "${EC2_HOST}"
          test -n "${EC2_USER}"
          mkdir -p "${HOME}/.ssh"
          install -m 600 /dev/null "${HOME}/.ssh/deploy_key"
          printf '%s\n' "${SSH_PRIVATE_KEY}" > "${HOME}/.ssh/deploy_key"
          ssh-keyscan -p "${{ steps.meta.outputs.ssh_port }}" -H "${EC2_HOST}" >> "${HOME}/.ssh/known_hosts"
          ssh -i "${HOME}/.ssh/deploy_key" \
            -p "${{ steps.meta.outputs.ssh_port }}" \
            -o StrictHostKeyChecking=yes \
            "${EC2_USER}@${EC2_HOST}" \
            "mkdir -p '${{ steps.meta.outputs.app_dir }}'"
          rsync -az --delete \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude 'dist/' \
            --exclude 'coverage/' \
            --exclude '.env' \
            --exclude '.cursor/' \
            --exclude 'docs/' \
            -e "ssh -i ${HOME}/.ssh/deploy_key -p ${{ steps.meta.outputs.ssh_port }} -o StrictHostKeyChecking=yes" \
            ./ "${EC2_USER}@${EC2_HOST}:${{ steps.meta.outputs.app_dir }}/"

      - name: Rebuild and restart on host
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.ssh"
          install -m 600 /dev/null "${HOME}/.ssh/deploy_key"
          printf '%s\n' "${SSH_PRIVATE_KEY}" > "${HOME}/.ssh/deploy_key"
          ssh -i "${HOME}/.ssh/deploy_key" \
            -p "${{ steps.meta.outputs.ssh_port }}" \
            -o StrictHostKeyChecking=yes \
            "${EC2_USER}@${EC2_HOST}" \
            "cd '${{ steps.meta.outputs.app_dir }}' && docker compose -f docker-compose.prod.yml up -d --build --remove-orphans"

      - name: Post-deploy health check
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail
          if [ -n "${HEALTHCHECK_URL:-}" ]; then
            for i in $(seq 1 30); do
              if curl -fsS --max-time 10 "${HEALTHCHECK_URL}" | tee /tmp/health.json; then
                grep -q '"status":"ok"' /tmp/health.json
                exit 0
              fi
              sleep 5
            done
            echo "Health check failed for ${HEALTHCHECK_URL}"
            exit 1
          fi
          mkdir -p "${HOME}/.ssh"
          install -m 600 /dev/null "${HOME}/.ssh/deploy_key"
          printf '%s\n' "${SSH_PRIVATE_KEY}" > "${HOME}/.ssh/deploy_key"
          ssh -i "${HOME}/.ssh/deploy_key" \
            -p "${{ steps.meta.outputs.ssh_port }}" \
            -o StrictHostKeyChecking=yes \
            "${EC2_USER}@${EC2_HOST}" \
            'for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/api/v1/health | grep -q "\"status\":\"ok\"" && exit 0; sleep 5; done; exit 1'
