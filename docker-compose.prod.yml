# Production stack for a single EC2 instance — the app ONLY.
#
# Postgres is on Amazon RDS (via DATABASE_URL), and TLS/routing is handled by an
# ALB (or CloudFront) in front, so there is no database or reverse-proxy service
# here. The app serves plain HTTP on the instance; the ALB terminates HTTPS and
# forwards to this container's published port. See deploy/DEPLOY-EC2.md.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: safein5-backend:latest
    container_name: safein5-backend
    restart: unless-stopped
    # All configuration comes from this file (copy .env.production.example ->
    # .env.production and fill it in). It is gitignored — never commit it.
    env_file:
      - .env.production
    ports:
      # host:container. The ALB target group points at the instance on this host
      # port. Keep the host port == PORT in .env.production.
      - '3000:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
