# Production / EC2: build API image on the host (no registry pull).
# Expect a host `.env` beside this file (never commit secrets).
# DATABASE_URL should point at Postgres on this instance (Compose service,
# host network, or RDS). Example for a sibling postgres container:
#   DATABASE_URL=postgresql://safein5:safein5@postgres:5432/safein5

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: safein5-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
