# Local dev dependencies for SafeIn5 backend.
# Postgres 16 (the migrator connects as the superuser `postgres`; the app
# connects as safein5_identity after `npm run db:bootstrap-roles`).
services:
  postgres:
    image: postgres:16
    container_name: safein5-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: safein5
    ports:
      - '5432:5432'
    volumes:
      - safein5-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d safein5']
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object store for video uploads (set S3_BUCKET_NAME to use it).
  # API on :9000, web console on http://localhost:9001 (minioadmin / minioadmin123).
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        ['CMD-SHELL', 'mc ready local || curl -sf http://localhost:9000/minio/health/live || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10

  # LocalStack — S3 + AWS Transcribe emulated locally, for testing the
  # speech-to-text flow without a real AWS account. Transcribe is a LocalStack
  # PRO feature, so this needs LOCALSTACK_AUTH_TOKEN (a free 14-day trial from
  # app.localstack.cloud works). Opt-in only — it won't start on a normal
  # `docker compose up`:
  #   LOCALSTACK_AUTH_TOKEN=... docker compose --profile localstack up -d localstack
  localstack:
    image: localstack/localstack:latest
    container_name: safein5-localstack
    profiles: ['localstack']
    ports:
      - '4566:4566'
    environment:
      SERVICES: s3,transcribe
      LOCALSTACK_AUTH_TOKEN: ls-budEJuja-CAzO-6160-9123-jUYIyAbI368c
      DEBUG: ${LOCALSTACK_DEBUG:-0}
      # Gateway-level CORS: the PWA (https://localhost:5173) uploads directly to
      # presigned S3 URLs on :4566, a cross-origin PUT the browser preflights.
      # Setting this at the gateway makes the preflight pass across restarts,
      # independent of per-bucket CORS (which LocalStack drops on a state reset).
      EXTRA_CORS_ALLOWED_ORIGINS: 'http://localhost:5173,https://localhost:5173'
      # Persist S3/Transcribe state to the localstack-data volume so a container or
      # machine restart RESTORES the bucket + uploaded objects. The init hook only
      # re-provisions a truly-empty volume; this covers restart-with-existing-volume
      # (the failure that lost the bucket overnight). LocalStack Pro feature.
      PERSISTENCE: 1
    volumes:
      - localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
      # Init hook: auto-create the bucket + CORS on every boot (survives resets).
      - ./localstack/init/ready.d:/etc/localstack/init/ready.d
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:4566/_localstack/health || exit 1']
      interval: 5s
      timeout: 10s
      retries: 20

volumes:
  safein5-pgdata:
  minio-data:
  localstack-data:
